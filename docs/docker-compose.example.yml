networks:
  tracker-profiles-network:
    name: tracker-profiles-network
    driver: bridge

services:

  tracker-profiles:
    image: zodac/tracker-profiles:13.0.0
    container_name: tracker-profiles
    hostname: tracker-profiles
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: "10G"   # ~400M per parallel browser and ~512M for the JVM (~4.5G with 10 browsers), with 2x headroom: raise it for more browsers or a larger BROWSER_RESOLUTION
          pids: "8192"    # ~200 per parallel browser (~2k with 10 browsers), with headroom: raise it if NUMBER_OF_PARALLEL_THREADS is above 20
    memswap_limit: "10G"
    environment:
      # Execution configuration (can also be changed on the 'Main' tab of the web UI)
      FORCE_UI_BROWSER: "false"
      INPUT_TIMEOUT_SECONDS: "0"                  # How long to wait for user input for a manual tracker, 0 waits until the user responds
      NUMBER_OF_PARALLEL_THREADS: "5"
      NUMBER_OF_SCREENSHOT_ATTEMPTS: "1"
      TAKE_SCREENSHOT_ON_ERROR: "false"
      TRACKER_EXECUTION_ORDER: "HEADLESS,MANUAL"  # Set to "HEADLESS" to only run trackers that need no browser UI (see DISPLAY below)
      # Browser configuration (can also be changed on the 'Settings' tab of the web UI)
      BROWSER_RESOLUTION: "1680x1050"
      ENABLE_TRANSLATION_TO_ENGLISH: "true"
      # Output configuration (can also be changed on the 'Settings' tab of the web UI)
      OUTPUT_DIRECTORY_NAME_FORMAT: "yyyy-MM-dd"
      OUTPUT_DIRECTORY_PARENT_PATH: "/app/screenshots"
      REDACTION_TYPE: "BOX"
      SCREENSHOT_EXISTS_ACTION: "CREATE_ANOTHER"
      TIMEZONE: "UTC"
      # Logging configuration (can also be changed on the 'Main' tab of the web UI)
      LOG_LEVEL: "INFO"
      # Application configuration (only read on startup)
      DATABASE_PATH: "/app/data/tracker-profiles.db"
      SECRET_KEY: "change-me-strong-secret"  # <--- TODO: Change this, generate using `openssl rand -base64 32`, and keep it for as long as the database is used
      WEB_UI_PORT: "8080"
      # Container configuration (only read on startup)
      DISPLAY: ":0"                # X11 display for the browser UI (Windows with VcXsrv: "host.docker.internal:0"), needed for MANUAL trackers
      JAVA_ADDITIONAL_OPTS: ""     # Extra JVM options, appended to the defaults
      JAVA_OPTS: ""                # Replaces the default JVM options entirely
    init: true  # Reaps the browser processes, and forwards the stop signal to the application
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tracker-profiles-network  # egress for the tracker websites
    ports:
      - "127.0.0.1:8080:8080"  # The web UI has no authentication, so it is only reachable from this host (change to "8080:8080" for the local network)
    read_only: true  # Immutable root filesystem - the app writes nothing outside /tmp and the volumes below
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    stop_grace_period: 30s  # Time to close any open browsers and the database
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev  # Browser shared memory (~35m with 5 parallel browsers)
    user: "1000:1000"  # nonroot user
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix  # Host X11 socket for the browser UI (remove on Windows, or if only HEADLESS trackers are run)
      - /tmp/screenshots:/app/screenshots  # Must be writable by UID 1000 (Windows: "C:/tmp/screenshots:/app/screenshots")
      - tracker-chrome-cache:/tmp/chrome-home
      - tracker-profiles-data:/app/data

volumes:
  tracker-chrome-cache:
    name: tracker-chrome-cache
  tracker-profiles-data:
    name: tracker-profiles-data
