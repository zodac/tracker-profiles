# The sandbox settings for this project, read by ai-sandbox/sandbox.sh on every launch.
#
# Plain bash, sourced on the HOST. Every value is a space-separated string, and an environment
# variable of the same name overrides it for one launch (`SANDBOX_PORTS= ai-sandbox/sandbox.sh`).
# See ai-sandbox/README.md for the full reference.

# No ports: tracker-profiles has no dev server (it is a CLI screenshot tool, not a web app).
SANDBOX_PORTS=""

# Named cache volumes, as `name:/container/path` pairs - each survives the sandbox's teardown as
# the docker volume `<sandbox-name>-<name>`:
#   m2 - the Maven local repository, so every fresh sandbox does not re-download the full
#        dependency set (~250 MB) on first `mvn` run.
SANDBOX_CACHE_VOLUMES="m2:/home/dev/.m2"

# No npm install dirs: this project has no frontend or test package.json.
SANDBOX_NPM_DIRS=""

# Extra environment for the sandbox, as KEY=VALUE pairs (no spaces inside a value).
# JAVA_HOME and MAVEN_HOME come from the Dockerfile's ENV.
SANDBOX_ENV=""

# Extra `docker run` flags, passed through as-is.
SANDBOX_RUN_ARGS=""

# Days of Claude session history (transcripts, file history, tool results) to keep in
# .claude-history; anything older is deleted when Claude starts. Memory and settings are always kept.
SANDBOX_HISTORY_DAYS=14

# Pin the docker name prefix instead of deriving it from this checkout's path (rarely needed).
# SANDBOX_NAME=""

# The sandbox's timezone (an IANA name); defaults to the host's.
# SANDBOX_TZ=""
