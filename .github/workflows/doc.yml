name: Documentation CI

on:
  push:
    branches: [ master ]
    paths:
      - '.claude/CLAUDE.md'
      - '.claude/agents/*.md'
      - '.github/workflows/doc.yml'
      - 'code-quality-config/markdown/.markdownlint.json'
      - 'README.md'
  workflow_dispatch: # allows manual trigger

jobs:
  analyze:
    name: Documentation Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true # code-quality-config: holds the shared markdownlint config

      - uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          config: 'code-quality-config/markdown/.markdownlint.json'
          globs: '**/*.md,!RELEASE_NOTES.md,!ai-sandbox/**,!code-quality-config/**'
          separator: ','
