name: Python CI

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/python.yml'
      - 'code-quality-config/python/ruff.toml'
      - 'docker/scripts/*.py'
  workflow_dispatch: # allows manual trigger

jobs:
  analyze:
    name: Python Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true # code-quality-config: holds the shared ruff config

      - name: Install Ruff
        run: pip install ruff==0.17.3

      - name: Run Ruff
        run: ruff check docker/scripts --config code-quality-config/python/ruff.toml
