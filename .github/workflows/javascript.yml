name: JavaScript CI

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/javascript.yml'
      - 'code-quality-config' # Submodule gitlink: a bump changes only this path, never the files inside it
      - 'tracker-profiles-screenshots/src/main/resources/net/zodac/tracker/framework/redactor/*.js'
  workflow_dispatch: # allows manual trigger

jobs:
  analyze:
    name: JavaScript Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true # code-quality-config: holds the shared eslint config

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'

      - name: Install ESLint
        run: npm install --save-dev eslint

      - name: Run ESLint
        run: npx eslint --config code-quality-config/javascript/eslint.config.cjs "tracker-profiles-screenshots/src/main/resources/**/*.js"
