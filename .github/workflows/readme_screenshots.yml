name: README Screenshots

# Generates the screenshots of the web UI shown in README.md again, and replaces the assets of a release (the latest by default). They are
# normally generated by 'Build and Publish Docker Image' when a release is created
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release to update (such as 1.2.3), or empty for the latest release'
        required: false
        default: ''

jobs:
  screenshots:
    name: Generate README Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Find the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION:-$(gh release view --json tagName --jq .tagName)}"
          echo "Using release: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends webp

      - name: Generate the README screenshots of the web UI
        run: |
          .github/scripts/generate_readme_screenshots.sh \
            "zodac/tracker-profiles:${{ steps.release.outputs.version }}" readme-screenshots

      - name: Upload the screenshots to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.version }}" readme-screenshots/*.webp --clobber
